name: CI

# 监听所有分支的 push 与所有 PR。
# 不用 branches 过滤器是有意的：pull_request 事件的工作流定义取自 base 分支，
# 而 master 上还没有这个文件时，PR 不会触发任何检查。
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 单元测试
        run: npm test

      - name: core 无框架依赖检查
        run: npm run typecheck:core

      - name: 代码规范
        run: npm run lint

      - name: 构建
        run: npm run build

      - name: 色卡产物与上游一致
        run: |
          node scripts/build-palettes.mjs
          git diff --exit-code src/core/palette/generated/palettes.ts
